global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: business-loan-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - business-loan-backend.business-loan.svc.cluster.local:8010
        labels:
          app: business-loan-backend
          environment: kubernetes
          namespace: business-loan
