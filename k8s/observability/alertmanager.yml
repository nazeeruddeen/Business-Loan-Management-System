global:
  resolve_timeout: 5m

route:
  receiver: business-loan-webhook
  group_by:
    - alertname
    - service
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h

receivers:
  - name: business-loan-webhook
    webhook_configs:
      - url: http://business-loan-alert-receiver.business-loan.svc.cluster.local:8080/
        send_resolved: true
