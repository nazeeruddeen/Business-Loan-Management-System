groups:
  - name: business-loan-domain
    rules:
      - alert: BusinessLoanReviewBacklogHigh
        expr: business_loan_review_backlog_count > 5
        for: 15m
        labels:
          severity: warning
          service: business-loan
        annotations:
          summary: Business loan review backlog is building
          description: Submitted and under-review applications have remained above 5 for 15 minutes.

      - alert: BusinessLoanOverdueInstallmentsHigh
        expr: business_loan_installments_overdue_count > 3
        for: 15m
        labels:
          severity: warning
          service: business-loan
        annotations:
          summary: Overdue business-loan installments detected
          description: More than 3 installments are overdue and need servicing follow-up.

      - alert: BusinessLoanOutstandingPortfolioHigh
        expr: business_loan_portfolio_amount{kind="outstanding_principal"} > 5000000
        for: 30m
        labels:
          severity: info
          service: business-loan
        annotations:
          summary: Outstanding business-loan principal is elevated
          description: Active portfolio outstanding principal has exceeded 5,000,000 for 30 minutes.

      - alert: BusinessLoanWorkflowLatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{job="business-loan-backend",uri=~"/api/v1/loan-applications.*|/api/v1/loan-accounts.*"}[5m]))) > 1.5
        for: 15m
        labels:
          severity: warning
          service: business-loan
        annotations:
          summary: Business workflow latency is above the SLO
          description: The p95 latency for core business-loan workflow endpoints has been above 1.5 seconds for 15 minutes.

      - alert: BusinessLoanWorkflowErrorRatioHigh
        expr: (sum(rate(http_server_requests_seconds_count{job="business-loan-backend",uri=~"/api/v1/loan-applications.*|/api/v1/loan-accounts.*",status=~"5.."}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count{job="business-loan-backend",uri=~"/api/v1/loan-applications.*|/api/v1/loan-accounts.*"}[5m])), 0.001)) > 0.02
        for: 10m
        labels:
          severity: critical
          service: business-loan
        annotations:
          summary: Business workflow 5xx ratio is above the SLO
          description: Core business-loan workflow endpoints have exceeded a 2% 5xx ratio for 10 minutes.
