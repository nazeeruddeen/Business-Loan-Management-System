services:
  mysql:
    image: mysql:8.4
    container_name: business-loan-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${BUSINESS_LOAN_MYSQL_ROOT_PASSWORD:?set BUSINESS_LOAN_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: business_loan_management
      MYSQL_USER: business_loan_app
      MYSQL_PASSWORD: ${BUSINESS_LOAN_DB_PASSWORD:?set BUSINESS_LOAN_DB_PASSWORD}
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: business-loan-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: business-loan-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: 8010
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/business_loan_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: business_loan_app
      SPRING_DATASOURCE_PASSWORD: ${BUSINESS_LOAN_DB_PASSWORD:?set BUSINESS_LOAN_DB_PASSWORD}
      APP_SECURITY_JWT_SECRET: ${BUSINESS_LOAN_JWT_SECRET:?set BUSINESS_LOAN_JWT_SECRET}
      APP_SECURITY_JWT_ACCESS_TOKEN_EXPIRATION_MS: 900000
      APP_SECURITY_JWT_REFRESH_TOKEN_EXPIRATION_MS: 604800000
      APP_SECURITY_ALLOWED_ORIGIN_PATTERNS: http://localhost:4300
      APP_SECURITY_BOOTSTRAP_USERS_ENABLED: "true"
      APP_SECURITY_BOOTSTRAP_ADMIN_PASSWORD: ${BUSINESS_LOAN_ADMIN_PASSWORD:?set BUSINESS_LOAN_ADMIN_PASSWORD}
      APP_SECURITY_BOOTSTRAP_OFFICER_PASSWORD: ${BUSINESS_LOAN_OFFICER_PASSWORD:?set BUSINESS_LOAN_OFFICER_PASSWORD}
      APP_SECURITY_BOOTSTRAP_REVIEWER_PASSWORD: ${BUSINESS_LOAN_REVIEWER_PASSWORD:?set BUSINESS_LOAN_REVIEWER_PASSWORD}
      APP_SECURITY_BOOTSTRAP_BORROWER_PASSWORD: ${BUSINESS_LOAN_BORROWER_PASSWORD:?set BUSINESS_LOAN_BORROWER_PASSWORD}
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_CACHE_TYPE: redis
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
    ports:
      - "8010:8010"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: business-loan-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      API_UPSTREAM: http://backend:8010
    ports:
      - "4300:80"
